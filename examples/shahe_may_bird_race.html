<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙河五月鸟赛 悦然慕羽队 34种鸟</title>
  <style>
    :root {
      --teal: #079b8b;
      --green: #35aa4c;
      --green-soft: #dff4df;
      --cyan: #12b9cd;
      --ink: #18221f;
      --muted: #77827c;
      --paper: #fbfbf5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef5ef;
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .poster {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--paper);
      max-width: 480px;
      box-shadow: 0 16px 48px rgb(0 0 0 / 14%);
    }

    .title-rail {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--teal);
      color: #fff;
      padding: 18px 10px;
    }

    .vertical-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .title-place,
    .title-team {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(26px, 8vw, 42px);
    }

    .title-count {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(28px, 9vw, 48px);
    }

    .content {
      padding: 18px 12px 12px;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary h1 {
      margin: 0;
      color: var(--teal);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .summary span {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .bird-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px 7px;
    }

    .bird-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1.5px solid #88ce8a;
      border-radius: 10px;
      background: linear-gradient(180deg, #eef8e9 0%, #f8fff6 100%);
      padding: 5px 5px 7px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 70%);
    }

    .bird-card:nth-child(3n) {
      border-color: #76d3dc;
      background: linear-gradient(180deg, #e9f9fb 0%, #f8ffff 100%);
    }

    .bird-number {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 17px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 1px 4px rgb(0 0 0 / 20%);
    }

    .bird-card:nth-child(3n) .bird-number {
      background: var(--cyan);
    }

    .bird-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 0.86;
      border-radius: 8px;
      object-fit: cover;
      background: var(--green-soft);
    }

    .bird-name {
      min-height: 34px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.15;
      word-break: keep-all;
    }

    .loading,
    .error {
      grid-column: 1 / -1;
      padding: 24px 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
    }

    .loading {
      background: #eef8e9;
      color: var(--teal);
    }

    .error {
      background: #fff0ed;
      color: #b33324;
    }

    .source {
      margin-top: 13px;
      color: #8a928d;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    @media (min-width: 481px) {
      .poster {
        grid-template-columns: 118px minmax(0, 1fr);
        max-width: 760px;
      }

      .content {
        padding: 26px 22px 18px;
      }

      .bird-grid {
        gap: 13px 12px;
      }

      .bird-name {
        font-size: 18px;
      }

      .bird-number {
        width: 32px;
        height: 24px;
        font-size: 13px;
      }

      .summary h1 {
        font-size: 26px;
      }

      .summary span,
      .source {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="沙河五月鸟赛 悦然慕羽队 34种鸟海报">
    <aside class="title-rail">
      <div class="vertical-title">
        <div class="title-place">沙河五月鸟赛</div>
        <div class="title-team">悦然慕羽队</div>
        <div class="title-count">34种鸟</div>
      </div>
    </aside>

    <section class="content">
      <header class="summary">
        <h1>沙河五月鸟赛</h1>
        <span>悦然慕羽队 · 34种鸟</span>
      </header>

      <div class="bird-grid" id="bird-grid">
        <div class="loading">正在加载 Macaulay 图片...</div>
      </div>

      <footer class="source">图片来源：Macaulay Library（经 Cloudinary 托管）</footer>
    </section>
  </main>

  <script>
    const birds = [
      { name: "斑嘴鸭", slug: "chinese_spot_billed_duck" },
      { name: "小䴙䴘", slug: "little_grebe" },
      { name: "凤头䴙䴘", slug: "great_crested_grebe" },
      { name: "山斑鸠", slug: "oriental_turtle_dove" },
      { name: "珠颈斑鸠", slug: "spotted_dove" },
      { name: "黄胸鹀", slug: "yellow_breasted_bunting" },
      { name: "普通雨燕", slug: "common_swift" },
      { name: "大杜鹃", slug: "common_cuckoo" },
      { name: "黑水鸡", slug: "common_moorhen" },
      { name: "白骨顶", slug: "common_coot" },
      { name: "夜鹭", slug: "black_crowned_night_heron" },
      { name: "池鹭", slug: "chinese_pond_heron" },
      { name: "苍鹭", slug: "grey_heron" },
      { name: "大白鹭", slug: "great_egret" },
      { name: "白鹭", slug: "little_egret" },
      { name: "普通鸬鹚", slug: "great_cormorant" },
      { name: "小鹀", slug: "little_bunting" },
      { name: "普通燕鸥", slug: "common_tern" },
      { name: "红隼", slug: "common_kestrel" },
      { name: "灰喜鹊", slug: "azure_winged_magpie" },
      { name: "喜鹊", slug: "oriental_magpie" },
      { name: "小嘴乌鸦", slug: "carrion_crow" },
      { name: "沼泽山雀", slug: "marsh_tit" },
      { name: "东方大苇莺", slug: "oriental_reed_warbler" },
      { name: "黑眉苇莺", slug: "black_browed_reed_warbler" },
      { name: "家燕", slug: "barn_swallow" },
      { name: "白头鹎", slug: "light_vented_bulbul" },
      { name: "巨嘴柳莺", slug: "raddes_warbler" },
      { name: "银喉长尾山雀", slug: "silver_throated_bushtit" },
      { name: "棕头鸦雀", slug: "vinous_throated_parrotbill" },
      { name: "灰椋鸟", slug: "white_cheeked_starling" },
      { name: "乌鸫", slug: "chinese_blackbird" },
      { name: "麻雀", slug: "eurasian_tree_sparrow" },
      { name: "金翅雀", slug: "oriental_greenfinch" }
    ];

    const grid = document.getElementById("bird-grid");

    function imageUrlFrom(data) {
      const first = data.macaulay && data.macaulay[0];
      if (!first || !first.url) {
        return "";
      }
      return first.url;
    }

    async function loadBirdData(slug) {
      const paths = [
        `../cloudinary_uploads_new/${slug}_cloudinary_urls.json`,
        `../cloudinary_uploads/${slug}_cloudinary_urls.json`
      ];

      for (const path of paths) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            const data = await response.json();
            if (imageUrlFrom(data)) {
              return data;
            }
          }
        } catch (error) {
          // Try the next local JSON directory.
        }
      }
      return null;
    }

    function renderCard(bird, index, imageUrl) {
      const card = document.createElement("article");
      card.className = "bird-card";
      const number = String(index + 1).padStart(2, "0");
      card.innerHTML = `
        <span class="bird-number">${number}</span>
        <img class="bird-image" src="${imageUrl}" alt="${bird.name}" loading="lazy">
        <div class="bird-name">${bird.name}</div>
      `;
      return card;
    }

    async function render() {
      const loaded = await Promise.all(
        birds.map(async (bird) => {
          const data = await loadBirdData(bird.slug);
          return { bird, imageUrl: data ? imageUrlFrom(data) : "" };
        })
      );

      const missing = loaded.filter((item) => !item.imageUrl);
      if (missing.length) {
        grid.innerHTML = `<div class="error">缺少 Macaulay 图片：${missing.map((item) => item.bird.name).join("、")}</div>`;
        return;
      }

      grid.innerHTML = "";
      loaded.forEach((item, index) => {
        grid.appendChild(renderCard(item.bird, index, item.imageUrl));
      });
    }

    render();
  </script>
</body>
</html>
