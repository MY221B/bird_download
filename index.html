<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙河五月鸟赛 悦然慕羽队 34种鸟</title>
  <style>
    :root {
      --teal: #079b8b;
      --green: #35aa4c;
      --green-soft: #dff4df;
      --ink: #18221f;
      --muted: #77827c;
      --paper: #fbfbf5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef5ef;
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .poster {
      margin: 0 auto;
      background: var(--paper);
      max-width: 480px;
      box-shadow: 0 16px 48px rgb(0 0 0 / 14%);
    }

    .content {
      padding: 18px 12px 12px;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary h1 {
      margin: 0;
      color: var(--teal);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .summary span {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .bird-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px 7px;
    }

    .bird-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1.5px solid #88ce8a;
      border-radius: 10px;
      background: linear-gradient(180deg, #eef8e9 0%, #f8fff6 100%);
      padding: 5px 5px 7px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 70%);
    }

    .bird-number {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 17px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 1px 4px rgb(0 0 0 / 20%);
    }

    .bird-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 0.86;
      border-radius: 8px;
      object-fit: cover;
      background: var(--green-soft);
    }

    .bird-name {
      min-height: 34px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.15;
      word-break: keep-all;
    }

    .source {
      margin-top: 13px;
      color: #8a928d;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    @media (min-width: 481px) {
      .poster {
        max-width: 760px;
      }

      .content {
        padding: 26px 22px 18px;
      }

      .bird-grid {
        gap: 13px 12px;
      }

      .bird-name {
        font-size: 18px;
      }

      .bird-number {
        width: 32px;
        height: 24px;
        font-size: 13px;
      }

      .summary h1 {
        font-size: 26px;
      }

      .summary span,
      .source {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="沙河五月鸟赛 悦然慕羽队 34种鸟海报">
    <section class="content">
      <header class="summary">
        <h1>沙河五月鸟赛</h1>
        <span>悦然慕羽队 · 34种鸟</span>
      </header>

      <div class="bird-grid" id="bird-grid"></div>

    </section>

    const grid = document.getElementById("bird-grid");

    birds.forEach((bird, index) => {
      const card = document.createElement("article");
      card.className = "bird-card";
      const number = String(index + 1).padStart(2, "0");
      card.innerHTML = `
        <span class="bird-number">${number}</span>
        <img class="bird-image" src="${bird.imageUrl}" alt="${bird.name}" loading="lazy">
        <div class="bird-name">${bird.name}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
